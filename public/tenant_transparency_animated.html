<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=EB+Garamond:ital,wght@1,600&display=swap');

*{ box-sizing:border-box; }

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.stage{
  width:100%;
  padding:40px 20px 60px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.logo-frame{
  width:100%;
  max-width:900px;
  container-type: inline-size;
  container-name: logo;
}

.icon-wrap{
  width:100%;
}
.icon-wrap img{
  width:100%;
  display:block;
}

.text-band{
  width:70.9961%;
  margin-left:13.7695%;
  margin-top:2.4cqw;
  container-type: inline-size;
  container-name: band;
}

.title-line{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  font-family:'Cinzel', 'Times New Roman', serif;
  font-weight:800;
  font-size:clamp(14px, 7.0cqw, 46px);
  letter-spacing:0.01em;
  line-height:1;
}

.tagline-line{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  font-family:'EB Garamond', Georgia, serif;
  font-style:italic;
  font-weight:600;
  font-size:clamp(9px, 4.3cqw, 28px);
  margin-top:0.5em;
  letter-spacing:0.01em;
}

.letter{
  display:inline-block;
  background:linear-gradient(to bottom,
    #050b2e 0%,
    #122a8c 38%,
    #3f5fc4 48%,
    #122a8c 58%,
    #050b2e 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-stroke:0.4px rgba(5,11,46,0.45);
  filter:drop-shadow(0 2px 1px rgba(0,0,0,0.4));
  opacity:0;
  transform:translateY(-180px) rotate(-10deg);
  animation-name:fall;
  animation-duration:1.05s;
  animation-timing-function:cubic-bezier(.34,1.4,.64,1);
  animation-fill-mode:forwards;
}

.space{
  display:inline-block;
  width:0.32em;
}

@keyframes fall{
  0%{
    opacity:0;
    transform:translateY(-180px) rotate(-10deg) scale(1);
  }
  55%{
    opacity:1;
    transform:translateY(9px) rotate(2deg) scale(1.08);
  }
  75%{
    transform:translateY(-4px) rotate(-1deg) scale(0.98);
  }
  100%{
    opacity:1;
    transform:translateY(0) rotate(0deg) scale(1);
  }
}

.replay-btn{
  margin-top:34px;
  padding:10px 22px;
  font-family:Georgia, serif;
  font-size:14px;
  background:#122a8c;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  letter-spacing:0.03em;
}
.replay-btn:hover{ background:#1c3fc0; }
</style>
</head>

<script>
function buildLetters(containerId, text, baseDelay, stagger){
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  let letterIndex = 0;
  [...text].forEach((ch) => {
    if(ch === ' '){
      const sp = document.createElement('span');
      sp.className = 'space';
      container.appendChild(sp);
      return;
    }
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch;
    span.style.animationDelay = (baseDelay + letterIndex * stagger) + 's';
    container.appendChild(span);
    letterIndex++;
  });
}

function playAnim(){
  buildLetters('title-text', 'TENANT TRANSPARENCY', 0.25, 0.09);
  buildLetters('tagline-text', 'Know Before You Lease', 2.9, 0.07);
}

playAnim();
</script>
